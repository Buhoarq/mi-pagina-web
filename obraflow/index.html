<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Fuera de servicio</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F1F5F9;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1E293B}
main{max-width:420px;margin:24px;padding:28px;background:#fff;border-radius:18px;box-shadow:0 4px 24px rgba(15,23,42,.08);text-align:center}h1{font-size:20px;margin:0 0 10px}p{margin:0;color:#475569;line-height:1.5;font-size:15px}</style></head>
<body><main><h1>Aplicación fuera de servicio</h1><p>Esta aplicación no está disponible por ahora.</p></main>
<script>/* borra lo que la aplicación anterior dejó guardado en este navegador (cachés y service workers) */
(async()=>{try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}}catch(e){}
try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}}catch(e){}})();</script></body></html>
